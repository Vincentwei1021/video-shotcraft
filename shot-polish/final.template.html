<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>video-shotcraft · 终版确认</title>
<style>
  :root {
    --bg: #0f0f0d; --panel: #171714; --panel2: #201f1b; --line: rgba(245,243,238,0.08);
    --ink: #f0ede5; --mid: #b5b0a5; --dim: #6f6b62; --accent: #d3923c;
    --ok: #4ade80; --fix: #f2b544; --drop: #f87171;
    --font: "Avenir Next", Avenir, -apple-system, "SF Pro Text", Inter, "PingFang SC", Arial, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  header.top { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px) saturate(1.2); background: rgba(15,15,13,0.85); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1720px; margin: 0 auto; padding: 0 28px; }
  .bar1 { display: flex; align-items: center; gap: 18px; padding: 16px 0 10px; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.03em; font-size: 18px; }
  .brand svg { width: 28px; height: 28px; }
  .brand small { color: var(--mid); font-weight: 500; margin-left: 4px; font-size: 13px; letter-spacing: 0; }
  .stats { color: var(--mid); font-size: 13px; font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 600; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .seg button { all: unset; cursor: pointer; padding: 6px 11px; font-size: 12.5px; color: var(--mid); border-radius: 7px; white-space: nowrap; }
  .seg button.on { background: #34322a; color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .bar2 { display: flex; align-items: center; gap: 10px; padding: 0 0 14px; flex-wrap: wrap; }
  .chip { all: unset; cursor: pointer; font-size: 12.5px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--mid); white-space: nowrap; }
  .chip .n { color: var(--dim); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .chip.on { color: #1d1306; background: var(--accent); border-color: transparent; }
  .chip.on .n { color: rgba(29,19,6,0.6); }
  input.search { all: unset; font-size: 13px; padding: 7px 12px; min-width: 200px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); }
  input.search::placeholder { color: var(--dim); }
  label.tog { font-size: 12.5px; color: var(--mid); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  main { padding: 18px 0 120px; }
  .intro { color: var(--mid); font-size: 14px; line-height: 1.7; margin: 10px 0 6px; max-width: 1100px; }
  .intro b { color: var(--ink); }
  .cathead { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 14px; scroll-margin-top: 150px; }
  .cathead h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  .cathead span { color: var(--dim); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin: 0 0 22px; overflow: hidden; scroll-margin-top: 150px; }
  .card.r-ok { border-color: rgba(74,222,128,0.35); } .card.r-fix { border-color: rgba(242,181,68,0.5); }
  .chead { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px 12px; flex-wrap: wrap; }
  .idx { font-family: var(--mono); color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chead h3 { margin: 0; font-size: 16.5px; font-weight: 650; }
  .chead .en { color: var(--mid); font-size: 13px; }
  .chead .stem { font-family: var(--mono); color: var(--dim); font-size: 12px; margin-left: auto; }
  .chead .stem a { text-decoration: none; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; color: #0b0b0a; }
  .badge.ghost { background: #2c2a24; color: var(--mid); font-weight: 600; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; }
  .stage.solo { grid-template-columns: 1fr; }
  .stage.solo .vbox { max-width: 1280px; width: 100%; margin: 0 auto; }
  .vbox { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; cursor: pointer; }
  .vbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .tag { position: absolute; left: 10px; top: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 8px; border-radius: 6px; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); pointer-events: none; z-index: 3; }
  .missing { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 13px; }
  .ctrl { display: flex; align-items: center; gap: 12px; padding: 12px 20px 4px; }
  .ctrl button { all: unset; cursor: pointer; font-size: 12.5px; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); padding: 5px 10px; border-radius: 7px; font-variant-numeric: tabular-nums; }
  .ctrl button:hover { background: #2a2923; }
  .ctrl input[type=range] { flex: 1; accent-color: var(--accent); }
  .ctrl .tc { font-family: var(--mono); font-size: 12px; color: var(--mid); min-width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
  .chg { margin: 10px 20px 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .chg h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  .chg ul { margin: 0; padding-left: 18px; color: #d6d2c8; font-size: 13px; line-height: 1.6; }
  .chg .none { color: var(--dim); font-size: 13px; }
  .review { display: flex; align-items: center; gap: 10px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .review .lbl { font-size: 12.5px; color: var(--mid); }
  .review button { all: unset; cursor: pointer; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink); background: var(--panel2); }
  .review button:hover { background: #2a2923; }
  .review button.ok.on { background: var(--ok); color: #08130b; border-color: transparent; font-weight: 650; }
  .review button.fix { color: var(--fix); }
  .review button.fix.on { background: var(--fix); color: #1d1306; border-color: transparent; font-weight: 650; }
  .review input.note { all: unset; flex: 1; min-width: 240px; font-size: 13px; padding: 7px 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); }
  .review input.note::placeholder { color: var(--dim); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .tools button { all: unset; cursor: pointer; font-size: 12.5px; padding: 6px 11px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); }
  .savest { font-size: 12px; color: var(--dim); }
  .savest.ok { color: var(--ok); } .savest.warn { color: var(--fix); }
  .empty { color: var(--dim); text-align: center; padding: 80px 0; }
  /* 去掉的镜头：小格子，进入视野才加载 */
  .dropgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .dcell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .dcell .vbox { border-radius: 0; cursor: default; }
  .dcell .vbox video { filter: grayscale(0.6); opacity: 0.75; }
  .dcell .meta { padding: 9px 11px 11px; font-size: 12.5px; line-height: 1.45; }
  .dcell .meta .s { font-family: var(--mono); color: var(--dim); font-size: 11.5px; }
  .dcell .gone { color: var(--drop); font-size: 11.5px; font-weight: 650; }
  @media (max-width: 1100px) { .stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar1">
      <div class="brand"><svg viewBox="0 0 128 128" aria-hidden="true"><path fill="#F5F3EE" d="M16 16h96v26H42v44h70v26H16V16Z"/><path fill="#D3923C" d="M92 48h28L84 84H56l36-36Z"/></svg>video-shotcraft<small data-i18n="subtitle"></small></div>
      <div class="stats" id="stats"></div>
      <div class="spacer"></div>
      <div class="seg" id="mode"><button data-v="side" class="on" data-i18n="side"></button><button data-v="solo" data-i18n="solo"></button></div>
      <div class="seg" id="speed"><button data-v="0.25">0.25×</button><button data-v="0.5">0.5×</button><button data-v="1" class="on">1×</button></div>
      <div class="seg" id="lang"><button data-v="zh" class="on">中文</button><button data-v="en">EN</button></div>
    </div>
    <div class="bar2">
      <div id="cats" style="display:flex; gap:8px; flex-wrap:wrap"></div>
      <div class="spacer"></div>
      <div class="seg" id="vfilter"><button data-v="all" class="on" data-i18n="vAll"></button><button data-v="before" data-i18n="before"></button><button data-v="v1" data-i18n="v1"></button><button data-v="after" data-i18n="after"></button></div>
      <div class="seg" id="cfilter"><button data-v="all" class="on" data-i18n="cAll"></button><button data-v="changed" data-i18n="changed"></button><button data-v="same" data-i18n="same"></button></div>
      <div class="seg" id="rfilter"><button data-v="all" class="on" data-i18n="rAll"></button><button data-v="none" data-i18n="rNone"></button><button data-v="ok" data-i18n="ok"></button><button data-v="fix" data-i18n="fix"></button></div>
      <div class="tools"><span class="savest" id="savest"></span><button id="export" data-i18n="export"></button></div>
      <label class="tog"><input type="checkbox" id="autoplay" checked /> <span data-i18n="autoplay"></span></label>
      <input class="search" id="q" />
    </div>
  </div>
</header>
<main class="wrap">
  <div class="intro" id="intro"></div>
  <div id="list"></div>
  <div class="cathead" id="dropped-head"><h2 data-i18n="droppedTitle"></h2><span id="dropped-n"></span></div>
  <div class="dropgrid" id="dropped"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
const FPS = 30;
const VER_COLOR = { before: '#8b93a1', v1: '#60a5fa', after: '#4ade80' };
const T = {
  zh: { subtitle: '终版确认', side: '改前 / 终版', solo: '只看终版', vAll: '全部版本', cAll: '全部', changed: '换了品牌', same: '未改动',
        rAll: '全部', rNone: '未确认', ok: '通过', fix: '要改', export: '导出确认 JSON', autoplay: '进入视野自动播放', search: '搜索卡名 / 组件名…',
        all: '全部', before: '原版', v1: '第一版', after: '第二版', prevTag: '选定版本 · 改品牌前', finalTag: '终版', brand: '品牌 / 文案改动',
        nonotes: '（暂无说明）', notyet: '尚未渲染', play: '播放', pause: '暂停', shots: '个镜头', confirm: '确认', notePh: '要改的地方（可选）',
        savedFile: '已保存到 shot-polish/final-review.json', savedLocal: '仅保存在浏览器（用 serve.py 启动可写入文件）', empty: '没有匹配的镜头',
        droppedTitle: '已去掉的镜头', cardGone: '整张卡已删除', styleGone: '只删这一式', reviewed: '已确认',
        intro: (k, d, c) => `按你的决策落版后保留 <b>${k}</b> 个镜头，画面里的 logo / 品牌名已换成 video-shotcraft，合适的文案换成了宣传语。每张卡左边是你选定的版本（改品牌前），右边是终版。逐个点「通过」或「要改」并写备注，会自动保存。页面底部是去掉的 <b>${d}</b> 个镜头，其中 <b>${c}</b> 张卡整卡删除。`,
        cats: { opening: '开场', camera: '运镜与空间', transition: '转场', typography: '文字排版', 'ui-entrance': 'UI 入场',
                interaction: '交互演示', data: '数据', effects: '特效', rhythm: '节奏', outro: '收尾' } },
  en: { subtitle: 'final review', side: 'Before brand / Final', solo: 'Final only', vAll: 'All versions', cAll: 'All', changed: 'Rebranded', same: 'Unchanged',
        rAll: 'All', rNone: 'Unreviewed', ok: 'Approve', fix: 'Needs fix', export: 'Export review JSON', autoplay: 'Autoplay in view', search: 'Search card / component…',
        all: 'All', before: 'Original', v1: 'V1', after: 'V2', prevTag: 'Chosen version · before rebrand', finalTag: 'Final', brand: 'Brand / copy changes',
        nonotes: '(no notes yet)', notyet: 'not rendered yet', play: 'Play', pause: 'Pause', shots: 'shots', confirm: 'Review', notePh: 'What to fix (optional)',
        savedFile: 'Saved to shot-polish/final-review.json', savedLocal: 'Saved in browser only (start with serve.py to write the file)', empty: 'No matching shots',
        droppedTitle: 'Dropped shots', cardGone: 'whole card removed', styleGone: 'style removed', reviewed: 'reviewed',
        intro: (k, d, c) => `<b>${k}</b> shots kept per your decisions; logos and brand names now read video-shotcraft, with promo copy where it fits. Left: the version you picked (before rebrand); right: final. Approve or flag each one — it saves automatically. The <b>${d}</b> dropped shots are listed at the bottom (<b>${c}</b> whole cards removed).`,
        cats: Object.fromEntries(DATA.cats.map(c => [c.key, c.en])) },
};
const state = { lang: localStorage.getItem('fr-lang') || 'zh', cat: 'all', q: '', mode: 'side', speed: 1, autoplay: true, vfilter: 'all', cfilter: 'all', rfilter: 'all' };
// 确认结果：{ [stem]: { verdict: 'ok'|'fix', note } }。serve.py 启动时读写 shot-polish/final-review.json，否则落 localStorage
let reviews = JSON.parse(localStorage.getItem('fr-reviews') || '{}');
let serverOK = false;
const t = k => T[state.lang][k];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const zh = () => state.lang === 'zh';

function applyI18n() {
  document.documentElement.lang = zh() ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.getElementById('q').placeholder = t('search');
  const cnt = k => DATA.items.filter(i => i.pick === k).length;
  const rv = k => DATA.items.filter(i => reviews[i.stem]?.verdict === k).length;
  document.getElementById('stats').innerHTML = `<b>${DATA.items.length}</b> ${t('shots')} <span style="color:var(--dim)">(${t('before')} ${cnt('before')} · ${t('v1')} ${cnt('v1')} · ${t('after')} ${cnt('after')})</span>` +
    ` · <b>${rv('ok') + rv('fix')}</b> ${t('reviewed')} <span style="color:var(--dim)">(${t('ok')} ${rv('ok')} · ${t('fix')} ${rv('fix')})</span>`;
  const cardsGone = new Set(DATA.dropped.filter(d => d.cardGone).map(d => d.card)).size;
  document.getElementById('intro').innerHTML = t('intro')(DATA.items.length, DATA.dropped.length, cardsGone);
  document.getElementById('dropped-n').textContent = `${DATA.dropped.length} ${t('shots')}`;
  renderSaveState();
}

function renderCats() {
  const counts = { all: DATA.items.length };
  DATA.items.forEach(i => { counts[i.cat] = (counts[i.cat] || 0) + 1; });
  const el = document.getElementById('cats');
  el.innerHTML = [['all', t('all')], ...DATA.cats.map(c => [c.key, t('cats')[c.key]])]
    .map(([k, label]) => `<button class="chip ${state.cat === k ? 'on' : ''}" data-k="${k}">${esc(label)}<span class="n">${counts[k] || 0}</span></button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => { state.cat = b.dataset.k; renderCats(); renderList(); });
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return DATA.items.filter(i => (state.cat === 'all' || i.cat === state.cat) &&
    (state.vfilter === 'all' || i.pick === state.vfilter) &&
    (state.cfilter === 'all' || (state.cfilter === 'changed' ? i.changed : !i.changed)) &&
    (state.rfilter === 'all' || (reviews[i.stem]?.verdict || 'none') === state.rfilter) &&
    (!q || [i.name, i.nameEn, i.stem, i.card].some(s => String(s).toLowerCase().includes(q))));
}

const vid = (src, cls, f) => src ? `<video class="vid ${cls}" data-src="${src}" data-frames="${f ?? ''}" muted loop playsinline preload="none"></video>` : `<div class="missing">${t('notyet')}</div>`;

let io;
function renderList() {
  if (io) io.disconnect();
  document.querySelectorAll('#list video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
  const items = filtered();
  const root = document.getElementById('list');
  if (!items.length) { root.innerHTML = `<div class="empty">${t('empty')}</div>`; return; }
  let html = '', lastCat = null, n = 0;
  for (const i of items) {
    if (i.cat !== lastCat) {
      lastCat = i.cat;
      html += `<div class="cathead"><h2>${esc(t('cats')[i.cat] || i.cat)}</h2><span>${items.filter(x => x.cat === i.cat).length} ${t('shots')}</span></div>`;
    }
    n++;
    const r = reviews[i.stem] || {};
    const notes = zh() ? i.brand : (i.brandEn.length ? i.brandEn : i.brand);
    const stage = state.mode === 'solo'
      ? `<div class="stage solo"><div class="vbox">${vid(i.final, 'v-final', i.fFinal)}<span class="tag" style="color:var(--accent)">${t('finalTag')}</span></div></div>`
      : `<div class="stage"><div class="vbox">${vid(i.prev, 'v-prev', i.fPrev)}<span class="tag" style="color:${VER_COLOR[i.pick]}">${t('prevTag')} · ${t(i.pick)}</span></div>
         <div class="vbox">${vid(i.final, 'v-final', i.fFinal)}<span class="tag" style="color:var(--accent)">${t('finalTag')}</span></div></div>`;
    html += `<section class="card ${r.verdict ? 'r-' + r.verdict : ''}" data-stem="${i.stem}" id="${i.stem}">
      <div class="chead"><span class="idx">${String(n).padStart(3, '0')}</span><h3>${esc(zh() ? i.name : i.nameEn)}</h3><span class="en">${esc(zh() ? i.nameEn : i.name)}</span>
        <span class="badge" style="background:${VER_COLOR[i.pick]}">${t(i.pick)}</span>${i.changed ? `<span class="badge" style="background:var(--accent)">${t('changed')}</span>` : `<span class="badge ghost">${t('same')}</span>`}
        <span class="stem"><a href="#${i.stem}">${esc(i.path)}</a></span></div>
      ${stage}
      <div class="ctrl"><button class="pp">${t('pause')}</button><button class="fb">◀ 1f</button><button class="ff">1f ▶</button>
        <input type="range" class="scrub" min="0" max="1000" value="0" /><span class="tc">0 / ${i.fFinal ?? i.fPrev ?? '–'}f</span></div>
      <div class="chg"><h4>${t('brand')}</h4>${notes.length ? `<ul>${notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : `<div class="none">${t('nonotes')}</div>`}</div>
      <div class="review"><span class="lbl">${t('confirm')}</span>
        <button class="rk ok ${r.verdict === 'ok' ? 'on' : ''}" data-k="ok">✓ ${t('ok')}</button><button class="rk fix ${r.verdict === 'fix' ? 'on' : ''}" data-k="fix">${t('fix')}</button>
        <input class="note" placeholder="${esc(t('notePh'))}" value="${esc(r.note || '')}" /></div>
    </section>`;
  }
  root.innerHTML = html;
  root.querySelectorAll('.card').forEach(setupCard);
  io = new IntersectionObserver(ents => ents.forEach(e => (e.isIntersecting ? activate(e.target) : deactivate(e.target))), { rootMargin: '300px 0px' });
  root.querySelectorAll('.card').forEach(c => io.observe(c));
}

// 终版为主时钟；帧数相同的改前版本逐帧跟随，不同的各自循环、进度条按比例定位
function setupCard(card) {
  const vids = [...card.querySelectorAll('video.vid')];
  const master = card.querySelector('.v-final') || vids[0];
  const followers = vids.filter(v => v !== master && v.dataset.frames && v.dataset.frames === master?.dataset.frames);
  const sameLen = vids.every(v => v.dataset.frames === master?.dataset.frames);
  card._vids = vids;
  card.querySelectorAll('.rk').forEach(btn => btn.onclick = () => setReview(card.dataset.stem, { verdict: reviews[card.dataset.stem]?.verdict === btn.dataset.k ? null : btn.dataset.k }, card));
  const note = card.querySelector('.note');
  note.oninput = () => setReview(card.dataset.stem, { note: note.value, ...(note.value && !reviews[card.dataset.stem]?.verdict ? { verdict: 'fix' } : {}) }, card, !(note.value && !reviews[card.dataset.stem]?.verdict));
  card._playing = state.autoplay;
  const pp = card.querySelector('.pp'), scrub = card.querySelector('.scrub'), tc = card.querySelector('.tc');
  const setPP = () => { pp.textContent = card._playing ? t('pause') : t('play'); };
  setPP();
  const playAll = () => { card._playing = true; setPP(); vids.forEach(v => { v.playbackRate = state.speed; v.play().catch(() => {}); }); };
  const pauseAll = () => { card._playing = false; setPP(); vids.forEach(v => v.pause()); };
  const seek = s => vids.forEach(v => { if (v.readyState) v.currentTime = Math.max(0, Math.min(s, (v.duration || s) - 0.001)); });
  const seekFrac = (fr, step) => vids.forEach(v => { if (!v.readyState || !v.duration) return; const tt = step != null ? v.currentTime + step : fr * v.duration; v.currentTime = Math.max(0, Math.min(tt, v.duration - 0.001)); });
  card._play = playAll; card._pause = pauseAll;
  pp.onclick = () => (card._playing ? pauseAll() : playAll());
  card.querySelectorAll('.vbox').forEach(vb => vb.addEventListener('click', () => pp.onclick()));
  card.querySelector('.fb').onclick = () => { pauseAll(); sameLen ? seek((master?.currentTime || 0) - 1 / FPS) : seekFrac(0, -1 / FPS); };
  card.querySelector('.ff').onclick = () => { pauseAll(); sameLen ? seek((master?.currentTime || 0) + 1 / FPS) : seekFrac(0, 1 / FPS); };
  scrub.oninput = () => { pauseAll(); if (master?.duration) sameLen ? seek((scrub.value / 1000) * master.duration) : seekFrac(scrub.value / 1000); };
  if (master) {
    card._tick = () => {
      if (!card._active) return;
      if (master.duration) {
        scrub.value = Math.round((master.currentTime / master.duration) * 1000);
        tc.textContent = `${Math.round(master.currentTime * FPS)} / ${Math.round(master.duration * FPS)}f`;
      }
      followers.forEach(sl => { if (sl.readyState && Math.abs(sl.currentTime - master.currentTime) > 1.5 / FPS) sl.currentTime = master.currentTime; });
      requestAnimationFrame(card._tick);
    };
  }
}
function activate(card) {
  if (card._active) return;
  card._active = true;
  card._vids.forEach(v => { if (!v.getAttribute('src')) { v.src = v.dataset.src; v.preload = 'auto'; } v.playbackRate = state.speed; });
  if (state.autoplay && card._playing !== false) card._play?.(); else card._vids.forEach(v => v.pause());
  card._tick && requestAnimationFrame(card._tick);
}
function deactivate(card) {
  if (!card._active) return;
  card._active = false;
  card._vids.forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
}

function renderDropped() {
  const el = document.getElementById('dropped');
  el.innerHTML = DATA.dropped.map(d => `<div class="dcell"><div class="vbox">${vid(d.v2, 'v-drop', null)}</div>
    <div class="meta">${esc(d.name)}<br><span class="s">${esc(d.cat)}/${esc(d.card)}</span> · <span class="gone">${d.cardGone ? t('cardGone') : t('styleGone')}</span></div></div>`).join('');
  const dio = new IntersectionObserver(ents => ents.forEach(e => {
    const v = e.target.querySelector('video'); if (!v) return;
    if (e.isIntersecting) { if (!v.getAttribute('src')) v.src = v.dataset.src; v.play().catch(() => {}); }
    else { v.pause(); v.removeAttribute('src'); v.load(); }
  }), { rootMargin: '200px 0px' });
  el.querySelectorAll('.dcell').forEach(c => dio.observe(c));
}

let saveTimer;
function setReview(stem, patch, card, quiet) {
  const cur = { ...(reviews[stem] || {}), ...patch, at: new Date().toISOString() };
  if (!cur.verdict && !cur.note) delete reviews[stem]; else reviews[stem] = cur;
  localStorage.setItem('fr-reviews', JSON.stringify(reviews));
  clearTimeout(saveTimer); saveTimer = setTimeout(saveToServer, 400);
  if (!quiet && card) {
    const v = reviews[stem]?.verdict;
    card.querySelectorAll('.rk').forEach(b => b.classList.toggle('on', b.dataset.k === v));
    card.classList.toggle('r-ok', v === 'ok'); card.classList.toggle('r-fix', v === 'fix');
    applyI18n();
  }
}
function exportPayload() {
  const items = DATA.items.map(i => ({ stem: i.stem, path: i.path, name: i.name, version: i.pick, verdict: reviews[i.stem]?.verdict || null, note: reviews[i.stem]?.note || '' }));
  const c = k => items.filter(x => x.verdict === k).length;
  return { savedAt: new Date().toISOString(), summary: { ok: c('ok'), fix: c('fix'), unreviewed: items.filter(x => !x.verdict).length }, decisions: items };
}
async function saveToServer() {
  try { serverOK = (await fetch('api/final-review', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(exportPayload()) })).ok; }
  catch { serverOK = false; }
  renderSaveState();
}
function renderSaveState() {
  const el = document.getElementById('savest');
  el.textContent = serverOK ? t('savedFile') : t('savedLocal');
  el.className = 'savest ' + (serverOK ? 'ok' : 'warn');
}
async function loadFromServer() {
  try {
    const r = await fetch('api/final-review', { cache: 'no-store' });
    if (!r.ok) return;
    serverOK = true;
    const j = await r.json();
    if (j && Array.isArray(j.decisions)) {
      const fromFile = {};
      j.decisions.forEach(d => { if (d.verdict || d.note) fromFile[d.stem] = { verdict: d.verdict, note: d.note }; });
      reviews = { ...reviews, ...fromFile };
      localStorage.setItem('fr-reviews', JSON.stringify(reviews));
    }
  } catch { serverOK = false; }
}
document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'final-review.json'; a.click();
};
function seg(id, key, cb) {
  const el = document.getElementById(id);
  el.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', String(state[key]) === b.dataset.v);
    b.onclick = () => { state[key] = key === 'speed' ? Number(b.dataset.v) : b.dataset.v; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(); };
  });
}
seg('mode', 'mode', renderList);
seg('vfilter', 'vfilter', renderList);
seg('cfilter', 'cfilter', renderList);
seg('rfilter', 'rfilter', renderList);
seg('speed', 'speed', () => document.querySelectorAll('video').forEach(v => { v.playbackRate = state.speed; }));
seg('lang', 'lang', () => { localStorage.setItem('fr-lang', state.lang); applyI18n(); renderCats(); renderList(); renderDropped(); });
document.getElementById('q').oninput = e => { state.q = e.target.value; renderList(); };
document.getElementById('autoplay').onchange = e => {
  state.autoplay = e.target.checked;
  document.querySelectorAll('.card').forEach(c => { if (c._active) (state.autoplay ? c._play() : c._pause()); });
};
loadFromServer().finally(() => {
  applyI18n(); renderCats(); renderList(); renderDropped();
  if (location.hash) setTimeout(() => document.getElementById(location.hash.slice(1))?.scrollIntoView(), 50);
});
</script>
</body>
