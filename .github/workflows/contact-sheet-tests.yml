name: Contact sheet tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'shot-polish/**'
      - '.github/workflows/contact-sheet-tests.yml'
  push:
    branches: [main]
    paths:
      - 'shot-polish/**'
      - '.github/workflows/contact-sheet-tests.yml'

permissions:
  contents: read

jobs:
  contact-sheet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify sampled frames and contact sheet pixels
        run: |
          # Test distro FFmpeg, including Ubuntu 22.04's FFmpeg 4.4.
          export PATH="/usr/bin:$PATH"
          ffmpeg -version
          python3 -m unittest discover -s shot-polish -p test_sheet.py -v
