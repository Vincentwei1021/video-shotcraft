name: Contact sheet tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'shot-polish/**'
      - '.github/workflows/contact-sheet-tests.yml'
  push:
    branches: [main]
    paths:
      - 'shot-polish/**'
      - '.github/workflows/contact-sheet-tests.yml'

permissions:
  contents: read

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify sampled frames and contact sheet pixels
        run: python3 -m unittest discover -s shot-polish -p test_sheet.py -v
