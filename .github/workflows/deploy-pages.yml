name: Deploy gallery to GitHub Pages

# Publishes gallery/ via the official Pages artifact path whenever it changes
# on main. Motion-preview MP4s live as assets on the `gallery-media` release
# (not in git) and are downloaded into place during assembly, so library.json's
# relative ./media/*.mp4 URLs keep working unchanged.
#
# NOTE: this deliberately does NOT push to a gh-pages branch. The repo's Pages
# publishing source must be set to "GitHub Actions" (build_type: workflow) —
# with the legacy branch source, commits pushed with GITHUB_TOKEN never
# trigger a Pages build, so the site silently stays stale.
on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a \
            --exclude 'sync-from-cards.py' \
            --exclude 'build-seo.py' \
            --exclude 'fetch-media.sh' \
            --exclude '__pycache__' \
            gallery/ site/
          touch site/.nojekyll

      # Pages 给静态资源发 cache-control: max-age=600，部署后十分钟内浏览器
      # 会拿旧 styles.css / app.js 配新 HTML（实际踩过：侧栏与顶栏样式全崩）。
      # 按文件内容哈希给资源链接打 ?v=，每个 HTML 版本只引用自己那代资源。
      - name: Stamp asset URLs for cache busting
        run: |
          python3 - <<'EOF'
          import hashlib, pathlib, re
          site = pathlib.Path('site')
          assets = {}
          for name in ('styles.css', 'app.js', 'showcase.js', 'translations.js'):
              path = site / name
              if path.exists():
                  assets[name] = hashlib.md5(path.read_bytes()).hexdigest()[:8]
          pattern = re.compile(
              r'(?P<attr>href|src)="\./(?P<name>' + '|'.join(map(re.escape, assets)) + r')(?:\?v=[^"]*)?"')
          for html in sorted(site.glob('*.html')):
              text = html.read_text(encoding='utf-8')
              stamped, hits = pattern.subn(
                  lambda m: f'{m["attr"]}="./{m["name"]}?v={assets[m["name"]]}"', text)
              if hits:
                  html.write_text(stamped, encoding='utf-8')
                  print(f'{html.name}: stamped {hits} asset link(s)')
          EOF

      - name: Download motion previews from the gallery-media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/media
          gh release download gallery-media \
            --repo "$GITHUB_REPOSITORY" \
            --dir site/media \
            --pattern '*.mp4' \
            --clobber

      - name: Download showcase submissions from the showcase-media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/showcase-media
          # 尚无投稿时 release 不存在：Showcase 页照常部署，列表为空
          if gh release view showcase-media --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download showcase-media \
              --repo "$GITHUB_REPOSITORY" \
              --dir site/showcase-media \
              --clobber
          fi
          if [ -f site/showcase-media/showcase.json ]; then
            mv site/showcase-media/showcase.json site/api/showcase.json
          else
            printf '{"items": []}\n' > site/api/showcase.json
          fi

      - name: Check every library.json preview has its file
        run: |
          python3 - <<'EOF'
          import json, os, sys
          lib = json.load(open('site/api/library.json'))
          missing = []
          for card in lib['cards']:
              for style in card['styles']:
                  media = style.get('media')
                  url = media.get('url') if isinstance(media, dict) else media
                  if not url:
                      continue
                  path = os.path.join('site', url.split('?')[0].lstrip('./'))
                  if not os.path.exists(path):
                      missing.append(path)
          if missing:
              print('missing media files:', *missing, sep='\n  ')
              sys.exit(1)
          print(f'all previews present ({len(lib["cards"])} cards checked)')
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
